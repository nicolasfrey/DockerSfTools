networks:
  nginx-proxy:
    external: true

volumes:
  # Volume renommé au passage à l'image officielle : l'ancien contenait la base de
  # Bitnami, appartenant à l'uid 1001, que prom/prometheus — qui tourne en 65534 — ne
  # peut pas écrire. Un volume neuf est créé avec les bons droits ; l'ancien
  # « <projet>_prometheus » peut être supprimé.
  prometheus-data:
  grafana-storage:

services:

  nginx-proxy:
    image: ${ARTIFACTORY_PATH}${REPOSITORY_PATH}nginx/nginx-proxy:latest
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - nginx-proxy

  openssh-server:
    image: ${ARTIFACTORY_PATH}${REPOSITORY_PATH}ssh/openssh-server:latest
    environment:
      PASSWORD_ACCESS: true
      USER_NAME: proxy
      USER_PASSWORD: pass
      DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
    ports:
      - "2222:2222"
    networks:
      - nginx-proxy

  prometheus:
    # Image officielle : Bitnami a retiré ses dépôts publics de Docker Hub en 2025, et
    # « bitnami/prometheus:latest » ne résout plus aucun manifeste — la pile commune
    # échouait donc à chaque démarrage. Les chemins par défaut de l'image officielle
    # diffèrent de ceux de Bitnami, d'où les deux montages ci-dessous.
    image: ${ARTIFACTORY_PATH}docker/prom/prometheus:latest
    environment:
      - VIRTUAL_HOST=prometheus.127x.me
      - VIRTUAL_PORT=9090
    volumes:
      - prometheus-data:/prometheus
      - ../config/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - nginx-proxy

  grafana:
    image: ${ARTIFACTORY_PATH}docker/grafana/grafana:latest
    environment:
      - VIRTUAL_HOST=grafana.127x.me
      - VIRTUAL_PORT=3000
    volumes:
      - ../config/grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml
      - ../config/grafana/dashboard.yaml:/etc/grafana/provisioning/dashboards/main.yaml
      - ../config/grafana/dashboards/:/var/lib/grafana/dashboards/
    networks:
      - nginx-proxy

  cadvisor:
    # Tirée directement de gcr.io, sans passer par l'Artifactory : celui-ci ne mire que
    # Docker Hub, où « google/cadvisor » est resté à la v0.33 de 2019 — le projet publie
    # depuis sur gcr.io. Version épinglée, puisque l'image vient de l'extérieur : la relever
    # est un geste volontaire, à faire en vérifiant que le conteneur reste « healthy ».
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    environment:
      - VIRTUAL_HOST=cadvisor.127x.me
      - VIRTUAL_PORT=8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - nginx-proxy
